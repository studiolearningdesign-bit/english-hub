<script>
(function(){
  const KEY='ld-teacher-dek', ITERS=100000;
  const root=document.getElementById('portalRoot');
  function b64(s){const x=atob(s),u=new Uint8Array(x.length);for(let i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return u}
  function tob64(u){let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
  async function unlockDek(dekBytes){
    try{
      const v=JSON.parse(document.getElementById('ld-teacher-vault').textContent);
      const dk=await crypto.subtle.importKey('raw',dekBytes,{name:'AES-GCM'},false,['decrypt']);
      const pb=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(v.main.iv)},dk,b64(v.main.data));
      root.innerHTML='<div class="no-print" style="text-align:right;margin-bottom:12px"><button type="button" id="lockBtn" style="background:#475569">Lock Guide</button></div>'+new TextDecoder().decode(pb);
      sessionStorage.setItem(KEY,tob64(dekBytes));
      const lb=document.getElementById('lockBtn');
      if(lb)lb.onclick=()=>{sessionStorage.removeItem(KEY);location.reload()};
      return true;
    }catch(_){sessionStorage.removeItem(KEY);return false}
  }
  async function verify(pin){
    const v=JSON.parse(document.getElementById('ld-teacher-vault').textContent);
    const bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
    for(const slot of v.slots){
      try{
        const wk=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(slot.salt),iterations:ITERS,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['decrypt']);
        const db=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(slot.iv)},wk,b64(slot.wrapped)));
        if(await unlockDek(db))return true;
      }catch(_){}
    }
    return false;
  }
  const form=document.getElementById('portalForm');
  if(form){
    form.addEventListener('submit',async(e)=>{
      e.preventDefault();
      const pin=(document.getElementById('portalPin').value||'').trim();
      const err=document.getElementById('portalErr');
      if(!pin){err.textContent='Ingresa el PIN.';return}
      try{
        if(!(await verify(pin)))err.textContent='PIN incorrecto.';
      }catch(_){err.textContent='Requiere HTTPS o localhost.';}
    });
  }
  const saved=sessionStorage.getItem(KEY);
  if(saved)unlockDek(b64(saved));
})();
</script></html>
